name: Game checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check JavaScript syntax
        shell: bash
        run: find site scripts test -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r -n 1 node --check
      - name: Test game rules
        run: npm test

  browser:
    runs-on: ubuntu-latest
    needs: rules
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install browser test tools
        if: ${{ hashFiles('scripts/browser-smoke.mjs') != '' }}
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Check browser interactions
        if: ${{ hashFiles('scripts/browser-smoke.mjs') != '' }}
        env:
          BASE_URL: http://127.0.0.1:3000
        run: |
          node scripts/serve.mjs > /tmp/game-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$BASE_URL/" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$BASE_URL/" > /dev/null
          node scripts/browser-smoke.mjs
          node scripts/browser-experience.mjs
          node scripts/browser-multiplayer.mjs
          node scripts/browser-guidance.mjs
      - name: Save browser results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-results
          path: |
            test-results/
            /tmp/game-server.log
          if-no-files-found: ignore
          retention-days: 7
